name: xiaoma-assistant
services:
  postgres:
    image: pgvector/pgvector:pg17
    network_mode: bridge
    environment:
      POSTGRES_USER: xiaoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xiaoma
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoma -d xiaoma"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
